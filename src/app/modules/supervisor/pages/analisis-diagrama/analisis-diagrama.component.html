<div class="analisis-diagrama-page" style="padding: 1.5rem;">

  <!-- Header -->
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem;">
    <h2 style="margin:0; font-size:1.25rem; font-weight:700; color:#111827;">
      Análisis del diagrama
    </h2>

    <p-toggleButton
      [(ngModel)]="modoAnalitica"
      onLabel="Vista normal"
      offLabel="Ver cuellos de botella"
      onIcon="pi pi-eye"
      offIcon="pi pi-chart-bar"
      (onChange)="onToggleAnalitica()"
      [disabled]="cargandoDiagrama">
    </p-toggleButton>
  </div>

  <!-- Leyenda de calor (solo en modo analítica con datos) -->
  <div
    *ngIf="modoAnalitica && bottlenecks.length > 0"
    style="display:flex; align-items:center; gap:0.75rem; margin-bottom:1rem;
           padding:0.75rem 1rem; background:white; border:1px solid #e5e7eb;
           border-radius:8px; font-size:0.85rem; color:#374151;">

    <span style="display:flex; align-items:center; gap:0.4rem;">
      <span style="display:inline-block; width:16px; height:16px; border-radius:4px;
                   background:#ef4444;"></span>
      <strong>#1 Crítico</strong>
    </span>

    <span style="font-size:1.1rem; color:#9ca3af;">→</span>

    <span style="display:flex; align-items:center; gap:0.4rem;">
      <span style="display:inline-block; width:16px; height:16px; border-radius:4px;
                   background:#22c55e;"></span>
      <strong>Menor tiempo</strong>
    </span>

    <span style="margin-left:0.5rem; color:#6b7280;">
      Pasa el cursor sobre un nodo para ver el promedio
    </span>
  </div>

  <!-- Spinner mientras carga bottlenecks -->
  <div *ngIf="cargandoBottlenecks"
       style="display:flex; align-items:center; gap:0.75rem; margin-bottom:1rem; color:#6b7280;">
    <p-progressSpinner strokeWidth="4" [style]="{width:'24px', height:'24px'}"/>
    <span>Cargando métricas de cuellos de botella…</span>
  </div>

  <!-- Sin datos de métricas -->
  <div
    *ngIf="sinDatosMetricas"
    style="margin-bottom:1rem; padding:0.75rem 1rem; background:#fef9c3;
           border:1px solid #fde68a; border-radius:8px; font-size:0.875rem; color:#92400e;">
    <i class="pi pi-info-circle" style="margin-right:0.4rem;"></i>
    Sin datos de métricas para esta versión.
  </div>

  <!-- Error al cargar diagrama -->
  <div *ngIf="errorDiagrama"
       style="padding:1rem; background:#fef2f2; border:1px solid #fca5a5;
              border-radius:8px; color:#991b1b; font-size:0.875rem;">
    <i class="pi pi-exclamation-triangle" style="margin-right:0.4rem;"></i>
    {{ errorDiagrama }}
  </div>

  <!-- Spinner carga del diagrama -->
  <div *ngIf="cargandoDiagrama"
       style="display:flex; align-items:center; gap:0.75rem; color:#6b7280;">
    <p-progressSpinner strokeWidth="4" [style]="{width:'28px', height:'28px'}"/>
    <span>Cargando diagrama…</span>
  </div>

  <!-- Canvas readonly -->
  <div *ngIf="!cargandoDiagrama && !errorDiagrama"
       style="overflow:auto; border-radius:8px;">
    <app-canvas-readonly
      [nodos]="nodos"
      [calles]="calles"
      [modoAnalitica]="modoAnalitica"
      [bottlenecks]="bottlenecks">
    </app-canvas-readonly>
  </div>

</div>
