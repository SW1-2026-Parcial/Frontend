<svg
  [attr.width]="CANVAS_W"
  [attr.height]="totalHeight"
  style="display:block; background:#f3f4f6; border:1px solid #e5e7eb; border-radius:8px;">

  <defs>
    <marker id="arrow-ro" markerWidth="8" markerHeight="8"
            refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Zona neutral -->
  <rect x="0" y="0" [attr.width]="CANVAS_W" [attr.height]="NEUTRAL_H" fill="#f9fafb"/>
  <text x="12" y="18" font-size="11" fill="#9ca3af">Zona de control (sin calle)</text>

  <!-- Swim lanes -->
  <ng-container *ngFor="let calle of calles; let i = index">
    <rect
      x="0"
      [attr.y]="NEUTRAL_H + i * LANE_H"
      [attr.width]="CANVAS_W"
      [attr.height]="LANE_H"
      fill="white"
      stroke="#d1d5db"
      stroke-width="1"/>

    <!-- Barra lateral de color -->
    <rect
      x="0"
      [attr.y]="NEUTRAL_H + i * LANE_H"
      width="44"
      [attr.height]="LANE_H"
      [attr.fill]="'hsl(' + (i * 60) + ', 70%, 85%)'"/>

    <!-- Nombre de calle rotado -->
    <text
      [attr.transform]="'translate(22,' + (NEUTRAL_H + i * LANE_H + LANE_H / 2) + ') rotate(-90)'"
      text-anchor="middle"
      font-size="12"
      font-weight="600"
      fill="#374151">
      {{ calle.nombre }}
    </text>
  </ng-container>

  <!-- Conexiones -->
  <ng-container *ngFor="let nodo of nodos">
    <ng-container *ngFor="let salida of nodo.salidas">
      <ng-container *ngIf="getDestinoNodo(salida.nodoDestino) as destino">
        <path
          [attr.d]="getConexionPath(nodo, destino)"
          fill="none"
          stroke="#6b7280"
          stroke-width="1.5"
          marker-end="url(#arrow-ro)"/>
        <text
          *ngIf="salida.etiqueta"
          [attr.x]="(nodo.posicionCanvas.x + destino.posicionCanvas.x) / 2"
          [attr.y]="(nodo.posicionCanvas.y + destino.posicionCanvas.y) / 2"
          font-size="10"
          fill="#6b7280"
          text-anchor="middle">
          {{ salida.etiqueta }}
        </text>
      </ng-container>
    </ng-container>
  </ng-container>

  <!-- Nodos -->
  <ng-container *ngFor="let nodo of nodos">
    <g [attr.transform]="'translate(' + nodo.posicionCanvas.x + ',' + nodo.posicionCanvas.y + ')'">
      <title>{{ getTooltip(nodo) }}</title>

      <!-- START -->
      <ng-container *ngIf="nodo.tipoNodo === 'START'">
        <circle cx="18" cy="18" r="18"
          [attr.fill]="getNodoFill(nodo)"
          stroke="#374151" stroke-width="3"/>
      </ng-container>

      <!-- END -->
      <ng-container *ngIf="nodo.tipoNodo === 'END'">
        <circle cx="18" cy="18" r="18" fill="white" stroke="#111827" stroke-width="4"/>
        <circle cx="18" cy="18" r="10" fill="#111827"/>
      </ng-container>

      <!-- ACTIVITY -->
      <ng-container *ngIf="nodo.tipoNodo === 'ACTIVITY'">
        <rect x="0" y="0" width="160" height="56" rx="6"
          [attr.fill]="getNodoFill(nodo)"
          stroke="#93c5fd" stroke-width="1.5"/>
        <text x="80" y="32"
          text-anchor="middle"
          dominant-baseline="middle"
          font-size="12" fill="#1e3a5f"
          style="pointer-events:none">
          {{ nodo.etiqueta }}
        </text>
        <!-- Ranking badge en modo analítica -->
        <text
          *ngIf="modoAnalitica && getRanking(nodo.nodoId) !== null"
          x="150" y="12"
          text-anchor="end"
          font-size="10"
          font-weight="700"
          fill="#374151">
          #{{ getRanking(nodo.nodoId) }}
        </text>
      </ng-container>

      <!-- DECISION -->
      <ng-container *ngIf="nodo.tipoNodo === 'DECISION'">
        <polygon points="32,0 64,32 32,64 0,32"
          [attr.fill]="getNodoFill(nodo)"
          stroke="#d97706" stroke-width="1.5"/>
        <text x="32" y="32"
          text-anchor="middle"
          dominant-baseline="middle"
          font-size="10" fill="#78350f">
          {{ nodo.etiqueta }}
        </text>
      </ng-container>

      <!-- MERGE -->
      <ng-container *ngIf="nodo.tipoNodo === 'MERGE'">
        <polygon points="32,0 64,32 32,64 0,32"
          [attr.fill]="getNodoFill(nodo)"
          stroke="#9ca3af" stroke-width="1.5"/>
        <text x="32" y="32"
          text-anchor="middle"
          dominant-baseline="middle"
          font-size="10" fill="#374151">
          {{ nodo.etiqueta }}
        </text>
      </ng-container>

      <!-- FORK -->
      <ng-container *ngIf="nodo.tipoNodo === 'FORK'">
        <rect x="0" y="0" width="12" height="120" fill="#374151"/>
        <text x="20" y="60"
          dominant-baseline="middle"
          font-size="10" fill="#374151">
          {{ nodo.etiqueta }}
        </text>
      </ng-container>

      <!-- JOIN -->
      <ng-container *ngIf="nodo.tipoNodo === 'JOIN'">
        <rect x="0" y="0" width="12" height="120" fill="#374151"/>
        <text x="20" y="60"
          dominant-baseline="middle"
          font-size="10" fill="#374151">
          {{ nodo.etiqueta }}
        </text>
      </ng-container>

    </g>
  </ng-container>

</svg>
