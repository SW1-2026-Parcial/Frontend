<p-toast />

<div class="editor-page">
  <!-- Header -->
  <div class="editor-header">
    <p-button
      icon="pi pi-arrow-left"
      label="Volver al repositorio"
      [text]="true"
      (onClick)="volver()"
    />
    <span class="doc-name" *ngIf="nombreDoc">
      <i class="pi pi-file-edit mr-2"></i>{{ nombreDoc }}
    </span>
    <p-button
      icon="pi pi-tag"
      label="Guardar versión"
      severity="success"
      (onClick)="abrirGuardarVersion()"
      pTooltip="Guarda el estado actual como una nueva versión nombrada"
      *ngIf="!loading && !error"
    />
    <p-button
      icon="pi pi-info-circle"
      label="Info / Permisos"
      [text]="true"
      severity="secondary"
      (onClick)="showDetalle = true"
      pTooltip="Ver información, historial y permisos del documento"
      styleClass="ml-auto"
    />
  </div>

  <!-- Loading -->
  <div class="editor-loading" *ngIf="loading">
    <p-progressBar mode="indeterminate" [style]="{ height: '4px' }" />
    <p class="text-center mt-3 text-color-secondary">Cargando editor colaborativo...</p>
  </div>

  <!-- Error -->
  <div class="editor-error" *ngIf="error">
    <i class="pi pi-exclamation-triangle text-4xl text-orange-500 mb-3"></i>
    <p>{{ error }}</p>
    <p-button label="Volver al repositorio" icon="pi pi-arrow-left" (onClick)="volver()" />
  </div>

  <!-- Editor Container -->
  <div
    #editorContainer
    id="onlyoffice-editor"
    class="editor-frame"
    [class.hidden]="loading || error"
  ></div>
</div>

<!-- Dialog: guardar versión nombrada -->
<p-dialog
  [(visible)]="showGuardarDialog"
  header="Guardar nueva versión"
  [modal]="true"
  [style]="{ width: '26rem' }"
  [closable]="!guardandoVersion">
  <div class="flex flex-column gap-3 pt-2">
    <p class="text-color-secondary m-0">
      Asigná un nombre a esta versión para identificarla en el historial.
    </p>
    <div class="flex flex-column gap-1">
      <label for="nombreVersion" class="font-semibold">Nombre de la versión</label>
      <input
        pInputText
        id="nombreVersion"
        [(ngModel)]="nombreVersion"
        placeholder="Ej: Revisión final, Borrador v2..."
        (keyup.enter)="confirmarGuardarVersion()"
        autofocus
      />
    </div>
  </div>
  <ng-template pTemplate="footer">
    <p-button
      label="Cancelar"
      [text]="true"
      severity="secondary"
      (onClick)="showGuardarDialog = false"
      [disabled]="guardandoVersion"
    />
    <p-button
      label="Guardar versión"
      icon="pi pi-tag"
      severity="success"
      [loading]="guardandoVersion"
      [disabled]="!nombreVersion.trim()"
      (onClick)="confirmarGuardarVersion()"
    />
  </ng-template>
</p-dialog>

<!-- Drawer: info, historial y permisos del documento -->
<p-drawer
  [(visible)]="showDetalle"
  position="right"
  [style]="{ width: '28rem' }"
  header="Información del Documento">
  <app-documento-detalle
    *ngIf="showDetalle && documentoId"
    [documentoId]="documentoId" />
</p-drawer>
