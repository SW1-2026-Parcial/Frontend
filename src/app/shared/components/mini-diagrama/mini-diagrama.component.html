<div class="mini-diagrama-container">
  <svg
    [attr.viewBox]="'0 0 ' + CANVAS_W + ' ' + totalHeight"
    width="100%"
    style="max-height: 320px;"
    preserveAspectRatio="xMidYMid meet">

    <defs>
      <marker id="arrow-mini" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <path d="M0,0 L0,6 L6,3 z" fill="#9ca3af"/>
      </marker>
    </defs>

    <!-- Zona neutral -->
    <rect x="0" y="0" [attr.width]="CANVAS_W" [attr.height]="NEUTRAL_H"
          fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>

    <!-- Swim lanes -->
    <g *ngFor="let calle of calles; let i = index">
      <rect [attr.x]="0" [attr.y]="NEUTRAL_H + i * LANE_H"
            [attr.width]="CANVAS_W" [attr.height]="LANE_H"
            fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
      <text [attr.x]="20" [attr.y]="NEUTRAL_H + i * LANE_H + LANE_H / 2"
            font-size="11" fill="#6b7280" text-anchor="middle"
            [attr.transform]="'rotate(-90, 20, ' + (NEUTRAL_H + i * LANE_H + LANE_H / 2) + ')'">
        {{ calle.nombre }}
      </text>
    </g>

    <!-- Conexiones -->
    <g *ngFor="let nodo of nodos">
      <g *ngFor="let salida of nodo.salidas">
        <ng-container *ngIf="getDestinoNodo(salida.nodoDestino) as destino">
          <path [attr.d]="getConexionPath(nodo, destino)"
                fill="none" stroke="#9ca3af" stroke-width="1.5"
                marker-end="url(#arrow-mini)"/>
        </ng-container>
      </g>
    </g>

    <!-- Nodos -->
    <g *ngFor="let nodo of nodos"
       [attr.opacity]="getNodoOpacity(nodo)"
       [style.cursor]="isClickable(nodo) ? 'pointer' : 'default'"
       (click)="onNodoClick(nodo)">

      <!-- START -->
      <ng-container *ngIf="nodo.tipoNodo === 'START'">
        <circle [attr.cx]="nodo.posicionCanvas.x + 18" [attr.cy]="nodo.posicionCanvas.y + 18"
                r="16" [attr.fill]="getNodoFill(nodo)" stroke="#374151" stroke-width="2"/>
      </ng-container>

      <!-- END -->
      <ng-container *ngIf="nodo.tipoNodo === 'END'">
        <circle [attr.cx]="nodo.posicionCanvas.x + 18" [attr.cy]="nodo.posicionCanvas.y + 18"
                r="16" [attr.fill]="getNodoFill(nodo)" stroke="#374151" stroke-width="4"/>
      </ng-container>

      <!-- ACTIVITY -->
      <ng-container *ngIf="nodo.tipoNodo === 'ACTIVITY'">
        <rect [attr.x]="nodo.posicionCanvas.x" [attr.y]="nodo.posicionCanvas.y"
              [attr.width]="getNodoW(nodo)" [attr.height]="getNodoH(nodo)"
              rx="6" [attr.fill]="getNodoFill(nodo)" stroke="#374151" stroke-width="1.5"/>
        <text [attr.x]="nodo.posicionCanvas.x + getNodoW(nodo)/2"
              [attr.y]="nodo.posicionCanvas.y + getNodoH(nodo)/2 + 4"
              font-size="10" text-anchor="middle" fill="#111827">
          {{ nodo.etiqueta | slice:0:20 }}{{ nodo.etiqueta.length > 20 ? '…' : '' }}
        </text>
        <!-- Indicador activo/completado -->
        <circle *ngIf="nodo.nodoId === nodoActualId"
                [attr.cx]="nodo.posicionCanvas.x + getNodoW(nodo) - 6"
                [attr.cy]="nodo.posicionCanvas.y + 6" r="5" fill="#f59e0b"/>
        <circle *ngIf="isClickable(nodo) && nodo.nodoId !== nodoActualId"
                [attr.cx]="nodo.posicionCanvas.x + getNodoW(nodo) - 6"
                [attr.cy]="nodo.posicionCanvas.y + 6" r="5" fill="#22c55e"/>
      </ng-container>

      <!-- DECISION / MERGE — rombo -->
      <ng-container *ngIf="nodo.tipoNodo === 'DECISION' || nodo.tipoNodo === 'MERGE'">
        <polygon
          [attr.points]="(nodo.posicionCanvas.x + getNodoW(nodo)/2)+','+(nodo.posicionCanvas.y)+' '+(nodo.posicionCanvas.x + getNodoW(nodo))+','+(nodo.posicionCanvas.y + getNodoH(nodo)/2)+' '+(nodo.posicionCanvas.x + getNodoW(nodo)/2)+','+(nodo.posicionCanvas.y + getNodoH(nodo))+' '+(nodo.posicionCanvas.x)+','+(nodo.posicionCanvas.y + getNodoH(nodo)/2)"
          [attr.fill]="getNodoFill(nodo)" stroke="#374151"
          [attr.stroke-dasharray]="nodo.tipoNodo === 'MERGE' ? '4,2' : 'none'" stroke-width="1.5"/>
      </ng-container>

      <!-- FORK / JOIN — barra -->
      <ng-container *ngIf="nodo.tipoNodo === 'FORK' || nodo.tipoNodo === 'JOIN'">
        <rect [attr.x]="nodo.posicionCanvas.x" [attr.y]="nodo.posicionCanvas.y"
              [attr.width]="getNodoW(nodo)" [attr.height]="getNodoH(nodo)" fill="#374151"/>
      </ng-container>

    </g>
  </svg>

  <p *ngIf="nodos.length === 0" class="mini-diagrama-vacio">
    Cargando diagrama…
  </p>
</div>
